name: CI - Build & Test FastAPI Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t fastapi-app ./06-docker

      - name: Start containers
        run: docker compose -f 06-docker/docker-compose.yml up -d

      - name: Wait for API to be ready
        run: sleep 10

      - name: Test API - POST a number
        run: |
          curl -f -X POST http://localhost:8000/numbers \
            -H "Content-Type: application/json" \
            -d '{"value": 99}'

      - name: Test API - GET numbers
        run: curl -f http://localhost:8000/numbers

      - name: Stop containers
        run: docker compose -f 06-docker/docker-compose.yml down

